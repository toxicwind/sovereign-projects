name: Lint

on:
  push:
    branches: [main, master]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.json'
      - 'bun.lockb'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.json'
      - 'bun.lockb'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/agent
          - packages/ai
          - packages/coding-agent
          - packages/tui
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run typecheck
        working-directory: ${{ matrix.package }}

  deps-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run check:pinned-deps
      - run: bun run check:shrinkwrap
      - run: bun run check:ts-imports
