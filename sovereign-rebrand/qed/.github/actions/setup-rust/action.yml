name: 'Setup Rust Environment'
description: 'Sets up Rust with caching and cross-compilation'

inputs:
  toolchain:
    description: 'Rust toolchain'
    default: 'stable'
  targets:
    description: 'Comma-separated target triples'
    default: ''
  components:
    description: 'Comma-separated components'
    default: 'clippy,rustfmt'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache cargo
      id: cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.targets }}
        cache-directories: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/

    - name: Install cross-compilation tools
      if: contains(inputs.targets, 'aarch64-unknown-linux-gnu')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
