name: Autonomous

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, master]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy,rustfmt
      - name: Check changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.rs$' | head -20)
          if [ -z "$CHANGED" ]; then
            echo "No Rust files changed. Skipping review."
            exit 0
          fi
          echo "Changed files: $CHANGED"
          echo "$CHANGED" > .changed-files
      - name: Run clippy on changed files
        if: hashFiles('.changed-files') != ''
        run: |
          for file in $(cat .changed-files); do
            echo "Checking $file..."
            cargo clippy --all-features -- -W clippy::all || true
          done
      - name: Check formatting
        if: hashFiles('.changed-files') != ''
        run: |
          for file in $(cat .changed-files); do
            rustfmt --check $file || true
          done

  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-fix')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-fix rustfmt formatting'
          branch: ${{ github.head_ref }}
