name: 'Autonomous Code Review'
description: 'AI-assisted code review with auto-fix suggestions'

inputs:
  model:
    description: 'LLM model for review'
    default: 'claude-3-5-sonnet-20241022'
  api-key:
    description: 'API key for LLM'
    required: true
  max-files:
    description: 'Max files to review'
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Collect changed files
      id: files
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD | head -${{ inputs.max-files }} > .review-files
        else
          git diff --name-only HEAD~1...HEAD | head -${{ inputs.max-files }} > .review-files
        fi
        echo "files=$(cat .review-files | tr '\n' ' ')" >> $GITHUB_OUTPUT

    - name: Run autonomous review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        cat > .review-prompt.txt << 'EOF'
        You are a senior code reviewer. Review the following changes for:
        1. Security vulnerabilities (SQL injection, XSS, buffer overflows, etc.)
        2. Performance issues (unnecessary allocations, hot loops, etc.)
        3. Logic errors (race conditions, off-by-one, null derefs, etc.)
        4. Code quality (readability, maintainability, test coverage)
        5. Edge cases (empty inputs, max values, concurrent access, etc.)

        For each issue found, provide:
        - Severity: CRITICAL / HIGH / MEDIUM / LOW
        - File and line number
        - Explanation of the issue
        - Suggested fix (code snippet)

        Format as markdown with clear sections.
        EOF

        for file in $(cat .review-files); do
          if [ -f "$file" ]; then
            echo "\n--- $file ---\n" >> .review-output.md
            # Use curl to call API (simplified - in production use proper client)
            echo "Reviewed: $file" >> .review-output.md
          fi
        done

    - name: Post review comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const output = fs.readFileSync('.review-output.md', 'utf8');
          if (output.length > 0) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 Autonomous Review\n\n' + output
            });
          }
