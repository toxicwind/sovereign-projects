name: Autonomous

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, master]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Check changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.go$' | head -20)
          if [ -z "$CHANGED" ]; then
            echo "No Go files changed. Skipping review."
            exit 0
          fi
          echo "Changed files: $CHANGED"
          echo "$CHANGED" > .changed-files
      - name: Run vet on changed files
        if: hashFiles('.changed-files') != ''
        run: |
          for file in $(cat .changed-files); do
            go vet ./$(dirname $file) || true
          done
      - name: Check formatting
        if: hashFiles('.changed-files') != ''
        run: |
          for file in $(cat .changed-files); do
            if [ -f "$file" ]; then
              gofmt -d $file | tee -a .gofmt-diff
            fi
          done
          if [ -s .gofmt-diff ]; then
            echo "::warning::Formatting issues found. Apply 'auto-fix' label to auto-fix."
          fi

  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-fix')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-go
      - run: gofmt -w .
      - run: goimports -w .
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-fix gofmt and goimports'
          branch: ${{ github.head_ref }}
