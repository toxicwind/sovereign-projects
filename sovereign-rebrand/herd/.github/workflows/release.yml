name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go test -race ./...
      - run: go vet ./...
      - run: golangci-lint run --timeout=5m

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o herd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd
      - uses: actions/upload-artifact@v4
        with:
          name: herd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: herd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: herd-*
      - run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && zip -r "../${dir%/}.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: false
          generate_release_notes: true
          body: |
            ## Herd ${{ github.ref_name }}

            Orchestrate fleets of LLM inference engines.

            ### Docker
            ```bash
docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
```

            ### Binary Installation

            **Linux (x64):**
            ```bash
curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/herd-linux-amd64.zip -o herd.zip && unzip herd.zip
```

            **macOS (ARM):**
            ```bash
curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/herd-darwin-arm64.zip -o herd.zip && unzip herd.zip
```

            **Windows:**
            Download `herd-windows-amd64.zip` and extract.
