# Key pools for herd-keypool (:25109). Key VALUES live only in /home/toxic/.secrets
# (parsed at startup + on SIGHUP, never logged). Only key NAMES appear here.
# Doctrine (Chris 2026-09-20): a 401/402/429 on one key is a ROUTING SIGNAL,
# not a death certificate -- the key is parked for a cooldown, traffic fails
# over to the next key, and the parked key revalidates on demand.
# NOTE: upstream has NO /v1 suffix -- the proxy joins upstream + request path
# (e.g. /openrouter-free/v1/chat/completions -> https://openrouter.ai/api/v1/chat/completions).
pools:
  # --- openrouter-free: free-models-only traffic (split 2026-09-20) ---
  # OPENROUTER_API_KEY_FREE is a FREE-MODELS-ONLY credential (Chris). It must
  # NEVER be selected for a paid model ID. Two independent guards enforce this:
  #   1. pool split: this is the only pool containing the free key, and every
  #      herd peer pointing here lists :free models only (verified live).
  #   2. key-level guard: free_only keys are skipped by herd-keypool.py
  #      (_is_free_model) whenever the request model is not a :free ID --
  #      defense in depth against a future misconfigured peer.
  openrouter-free:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key      # cheap: returns key info, no spend
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - {name: OPENROUTER_API_KEY_FREE, free_only: true}  # free-models-only key, first
      - OPENROUTER_API_KEY_1                              # failover: alive, has free-model allowance
  # --- openrouter-paid: paid OpenRouter traffic (Kimi etc., split 2026-09-20) ---
  # The free-only key is EXCLUDED here by design: paid model IDs must never
  # burn the free credential (402) before failing over to a real key.
  openrouter-paid:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_1
  # --- gemini: Google AI via OpenAI-compatible endpoint (free tier first)
  gemini:
    upstream: https://generativelanguage.googleapis.com/v1beta/openai
    health:
      method: GET
      path: /v1/models        # cheap: lists models for the key, no spend
      ok: [200]
    fail_status: [400, 401, 402, 403, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      400: 120
      401: 300
      402: 300
      403: 300
      429: 60
      default: 120
    keys:
      - GEMINI_API_KEY
      - GEMINI_API_KEY_1
      - GEMINI_API_KEY_2
      - GEMINI_API_KEY_3
      - GEMINI_API_KEY_4
      - GEMINI_API_KEY_5

  # --- template: add the next provider pool here (copy, fill, SIGHUP the daemon)
